{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="sub-text">
            Start your journey with AI Career Copilot by creating an account. Please fill in the details below to get started.
        </p>
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <p class="sub-text">Use atleast 6 characters</p>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch-auth">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
